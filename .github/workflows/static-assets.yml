name: Static assets

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.7.12'
          cache: true

      - name: Install locked dependencies
        run: deno install --frozen --allow-scripts=npm:esbuild

      - name: Check types and Svelte components
        run: deno task check

      - name: Build static assets
        run: deno task build

      - name: Package static assets
        run: |
          test -s build/index.html
          test -d build/_app/immutable
          mkdir -p dist
          tar -czf dist/compose-ui-static.tar.gz -C build .
          (cd build && zip -qr ../dist/compose-ui-static.zip .)
          cd dist
          sha256sum compose-ui-static.tar.gz compose-ui-static.zip > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compose-ui-static
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release assets
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/int')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: compose-ui-static
          path: dist

      - name: Verify and upload release assets
        if: github.event_name == 'release'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" \
            compose-ui-static.tar.gz compose-ui-static.zip SHA256SUMS \
            --clobber

      - name: Publish int prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/int'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          prerelease_tag="int-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if gh release view "$prerelease_tag" >/dev/null 2>&1; then
            gh release upload "$prerelease_tag" \
              compose-ui-static.tar.gz compose-ui-static.zip SHA256SUMS \
              --clobber
          else
            gh release create "$prerelease_tag" \
              compose-ui-static.tar.gz compose-ui-static.zip SHA256SUMS \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "int build ${GITHUB_RUN_NUMBER}" \
              --notes "Static assets from int commit ${GITHUB_SHA}."
          fi
