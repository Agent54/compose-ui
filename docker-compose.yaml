name: compose

services:
  ui:
    build: .
    environment:
      - NODE_ENV=development
      - DENO_NO_UPDATE_CHECK=1
    init: true
    ports:
      - "${UI_PORT:-5177}:5173"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

        - action: sync
          path: ./static
          target: /app/static

        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./deno.json
        - action: rebuild
          path: ./deno.lock
        - action: rebuild
          path: ./svelte.config.js
        - action: rebuild
          path: ./vite.config.ts
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./Dockerfile
